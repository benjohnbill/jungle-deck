<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jungle-deck 예시</title>
<style>
:root { color-scheme: light dark; --bg: #f4f2ee; --ink: #1d1b19; --muted: #6b665f; --line: #d9d4cc; --card: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141312; --ink: #ece8e2; --muted: #9a948c; --line: #34312d; --card: #1e1c1a; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 8px; }
p { margin: 0 0 24px; color: var(--muted); }
a.deck { display: block; padding: 16px 20px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
a.deck:hover, a.deck:focus-visible { border-color: var(--ink); }
a.deck strong { display: block; }
a.deck span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pintos 시스템 콜 발표 예시</h1>
  <p>최근 업데이트를 반영한 프로토타입이에요. 같은 발표를 두 가지 도식으로 그렸어요. 스킬이 만드는 결과물에는 버전 Y가 가장 가까워요. 발표 자료를 열고 → 키로 넘기고, N 키로 발표자 노트를 볼 수 있어요. 차트 수치는 예시 데이터예요.</p>
  <a class="deck" href="deck-X.html"><strong>버전 X</strong><span>도식마다 내용을 자세히 담았어요.</span></a>
  <a class="deck" href="deck-Y.html"><strong>버전 Y</strong><span>도식마다 요점을 하나만 담았어요.</span></a>
</main>
</body>
</html>
